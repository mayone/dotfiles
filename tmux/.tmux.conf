# -- general -------------------------------------------------------------------

set -g default-terminal "screen-256color"
# true colour on the terminals this config is used with
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB,alacritty:RGB"

# GNU-Screen compatible prefix
# set -g prefix2 C-a
# bind C-a send-prefix -2

set -s escape-time 10                     # older tmux waits 500ms after Escape
set -s focus-events on                    # let vim see focus changes
set -g history-limit 50000                # boost history
set -g detach-on-destroy off              # closing a session switches to another

# reload configuration
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

# -- display -------------------------------------------------------------------

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

# -- plugins -------------------------------------------------------------------

# prefix + I: install, prefix + U: update, prefix + alt + u: remove unlisted
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @plugin 'omerxx/tmux-sessionx'

# install tpm and the plugins on first start
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
if "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# -- theme ---------------------------------------------------------------------

# Catppuccin needs a Nerd Font. The icons set here are \u escapes from the
# Powerline and Font Awesome ranges, which every Nerd Font version ships; the
# plugin defaults they replace need Nerd Fonts 2.3 or newer.
# @catppuccin_* options are read when the plugin loads, status-left/right are
# built from its modules afterwards.

set -g @catppuccin_flavor "mocha"   # latte, frappe, macchiato or mocha

# windows
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_flags_icon_last ""
set -g @catppuccin_window_flags_icon_current ""
set -g @catppuccin_window_flags_icon_zoom " \uF00E"       # search-plus
set -g @catppuccin_window_flags_icon_mark " \uF02E"       # bookmark
set -g @catppuccin_window_flags_icon_silent " \uF1F6"     # bell-slash
set -g @catppuccin_window_flags_icon_activity " \uF111"   # circle
set -g @catppuccin_window_flags_icon_bell " \uF0F3"       # bell

# status modules
set -g @catppuccin_status_left_separator "\uE0B6"
set -g @catppuccin_status_right_separator "\uE0B4 "
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_load_icon "\uF0E4 "                    # tachometer
set -g @catppuccin_load_color "#{@thm_yellow}"
set -g @catppuccin_host_icon "\uF233 "                    # server
set -g @catppuccin_host_color "#{@thm_peach}"
set -g @catppuccin_host_text " #h"
set -g @catppuccin_date_time_icon "\uF073 "               # calendar
set -g @catppuccin_date_time_text " %Y/%m/%d %H:%M"

if "test -f ~/.tmux/plugins/tmux/catppuccin.tmux" \
  "run ~/.tmux/plugins/tmux/catppuccin.tmux"

set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -gF status-right "#{E:@catppuccin_status_load}"
set -ag status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

#set -g visual-bell on
#setw -g window-status-alert-fg red
#setw -g window-status-alert-bg yellow

# activity
setw -g monitor-activity on

# -- navigation ----------------------------------------------------------------

# create session
bind C-c new-session

# find session, SessionX takes this key over once it loads with fzf-tmux on PATH
bind C-f command-prompt -p find-session 'switch-client -t %%'

# new windows and panes start in the current directory
bind c new-window -c "#{pane_current_path}"
# split current window horizontally
bind - split-window -v -c "#{pane_current_path}"
# split current window vertically
bind _ split-window -h -c "#{pane_current_path}"

# pane navigation
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# maximize current pane
bind + resize-pane -Z

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# window navigation
#unbind n
#unbind p
#bind -r C-h previous-window # select previous window
#bind -r C-l next-window     # select next window
bind Tab last-window        # move to last active window

# enable Mouse mode
set -g mouse on
# toggle mouse
bind m set -g mouse \; display "mouse #{?mouse,on,off}"

# support vi mode operation
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# -- sessionx ------------------------------------------------------------------

# prefix + C-f: fuzzy session switcher, needs fzf-tmux on the server's PATH.
# Without it C-f stays the find-session prompt and SessionX keeps its default O.
if "command -v fzf-tmux" "set -g @sessionx-bind 'C-f'" "set -gu @sessionx-bind"
set -g @sessionx-filter-current 'false'
# FIXME: sessionx bakes an empty session name into the border label when it
# loads (omerxx/tmux-sessionx#227), so the start bind sets it per popup instead.
set -g @sessionx-additional-options "--color=bg+:#313244,spinner:#f5e0dc,hl:#f38ba8,fg:#cdd6f4,header:#f38ba8,info:#cba6f7,pointer:#f5e0dc,marker:#b4befe,fg+:#cdd6f4,prompt:#cba6f7,hl+:#f38ba8,border:#6c7086,label:#cdd6f4 --bind 'start:transform-border-label(tmux display-message -p \" Current session: #S \")'"

# -- tpm -----------------------------------------------------------------------

# keep at the bottom: loads every plugin listed above
if "test -x ~/.tmux/plugins/tpm/tpm" "run '~/.tmux/plugins/tpm/tpm'"
