# Linked to ~/.config/mise/config.toml by mise/apply.sh

[settings]
# NixOS compiles tools from source by default until mise 2027.8.0. Use the
# precompiled binaries there too; they need nix-ld (see nix/configuration.nix)
all_compile = false
# Keep `go install` binaries in ~/go/bin, which zsh/.zshrc puts on PATH,
# instead of the bin directory of one Go version
go.set_gobin = false

[tools]
bat = "latest"
# yt-dlp needs a JavaScript runtime for full YouTube support, and Deno is the
# only one that it enables by default
deno = "latest"
eza = "latest"
fzf = "latest"
gh = "latest"
herdr = "latest"
jq = "latest"
just = "latest"
ripgrep = "latest"
shfmt = "latest"
yt-dlp = "latest"

# macOS only, like the Homebrew formulae and cask they replace. NixOS gets tmux,
# htop, wget, ffmpeg, and Python from nix/configuration.nix, and Debian and
# Ubuntu get tmux from apt
claude = { version = "latest", os = ["macos"] }
"conda:htop" = { version = "latest", os = ["macos"] }
"conda:wget" = { version = "latest", os = ["macos"] }
ffmpeg = { version = "latest", os = ["macos"] }
"github:boyter/scc" = { version = "latest", os = ["macos"] }
# Python 3.14, as the Homebrew formula installed
python = { version = "3.14", os = ["macos"] }
tmux = { version = "latest", os = ["macos"] }

[bootstrap.brew]
# Take over an app that is already in /Applications instead of replacing it,
# which can reset its macOS privacy permissions. A different build of an app
# that does not update itself makes the install fail and leaves the app alone
adopt = true

# Host packages for `mise bootstrap`. mise installs the Homebrew casks itself,
# without the Homebrew program
[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:libssl-dev" = "latest"
"apt:pkg-config" = "latest"
"apt:tmux" = "latest"
"apt:zsh" = "latest"

# App uninstallation
"brew-cask:appcleaner" = { os = "macos" }
"brew-cask:font-meslo-lg-nerd-font" = { os = "macos" }
"brew-cask:ghostty" = { os = "macos" }
"brew-cask:gimp" = { os = "macos" }
"brew-cask:google-chrome" = { os = "macos" }
"brew-cask:iterm2" = { os = "macos" }
"brew-cask:musescore" = { os = "macos" }
"brew-cask:notion" = { os = "macos" }
# Window management
"brew-cask:rectangle" = { os = "macos" }
"brew-cask:visual-studio-code" = { os = "macos" }
"brew-cask:vlc" = { os = "macos" }

