# Linked to ~/.config/mise/config.toml by mise/apply.sh

[settings]
# NixOS compiles tools from source by default until mise 2027.8.0. Use the
# precompiled binaries there too; they need nix-ld (see nix/configuration.nix)
all_compile = false
# Keep `go install` binaries in ~/go/bin, which zsh/.zshrc puts on PATH,
# instead of the bin directory of one Go version
go.set_gobin = false

[tools]
bat = "latest"
eza = "latest"
fzf = "latest"
gh = "latest"
jq = "latest"
just = "latest"
ripgrep = "latest"
shfmt = "latest"
yt-dlp = "latest"

[bootstrap.brew]
# Take over an app that is already in /Applications instead of replacing it,
# which can reset its macOS privacy permissions. A different build of an app
# that does not update itself makes the install fail and leaves the app alone
adopt = true

# Host packages for `mise bootstrap`. mise installs the Homebrew formulae and
# casks itself, without the Homebrew program
[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:libssl-dev" = "latest"
"apt:pkg-config" = "latest"
"apt:tmux" = "latest"
"apt:zsh" = "latest"

"brew:ffmpeg" = { os = "macos" }
"brew:htop" = { os = "macos" }
"brew:loc" = { os = "macos" }
"brew:tmux" = { os = "macos" }
"brew:wget" = { os = "macos" }

# App uninstallation
"brew-cask:appcleaner" = { os = "macos" }
"brew-cask:chatgpt" = { os = "macos" }
"brew-cask:claude-code@latest" = { os = "macos" }
"brew-cask:cursor" = { os = "macos" }
"brew-cask:discord" = { os = "macos" }
"brew-cask:figma" = { os = "macos" }
"brew-cask:gimp" = { os = "macos" }
"brew-cask:google-chrome" = { os = "macos" }
"brew-cask:iterm2" = { os = "macos" }
"brew-cask:musescore" = { os = "macos" }
"brew-cask:notion" = { os = "macos" }
# Window management
"brew-cask:rectangle" = { os = "macos" }
# VPN
"brew-cask:tunnelbear" = { os = "macos" }
"brew-cask:visual-studio-code" = { os = "macos" }
"brew-cask:vlc" = { os = "macos" }

