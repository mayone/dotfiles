# Linked to ~/.config/mise/conf.d/dev.toml by mise/apply.sh, unless NO_DEV is set

[tools]
node = "lts"
pnpm = "latest"
# Yarn Classic, as the Homebrew formula installed
yarn = "1"
go = "latest"
java = "temurin-25"
k9s = "latest"
kubectl = "latest"
kubectx = "latest"
kubens = "latest"
mkcert = "latest"
neovim = "latest"
"npm:ccusage" = "latest"

# Docker on macOS without Docker Desktop: `colima start` runs the engine in a
# Lima VM. Linux gets the engine, the docker CLI, and Buildx from the system
colima = { version = "latest", os = ["macos"] }
docker-cli = { version = "latest", os = ["macos"] }
lima = { version = "latest", os = ["macos"] }

# The postinstall links put the Compose and Buildx plugins where the docker CLI
# looks for them, and every `mise install` repairs them. The docker CLI reads
# ~/.docker/cli-plugins before the system plugin directories, so on Linux
# `docker compose` runs this Compose and not the one that the system includes
[tools.docker-compose]
version = "latest"
postinstall = { run = 'mkdir -p "$HOME/.docker/cli-plugins" && ln -sfn "$(command -v docker-compose)" "$HOME/.docker/cli-plugins/docker-compose"', when = "always" }

[tools."github:docker/buildx"]
version = "latest"
os = ["macos"]
bin = "docker-buildx"
postinstall = { run = 'mkdir -p "$HOME/.docker/cli-plugins" && ln -sfn "$(command -v docker-buildx)" "$HOME/.docker/cli-plugins/docker-buildx"', when = "always" }

# docker login keeps credentials in the Keychain only when
# docker-credential-osxkeychain is on PATH; without it they go into
# ~/.docker/config.json as base64 plain text
[tools."github:docker/docker-credential-helpers"]
version = "latest"
os = ["macos"]
matching = "osxkeychain"
bin = "docker-credential-osxkeychain"

[bootstrap.packages]
"brew-cask:postman" = { os = "macos" }
